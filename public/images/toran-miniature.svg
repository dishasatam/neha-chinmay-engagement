<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="toranBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4A101D"/>
      <stop offset="100%" stop-color="#1F040A"/>
    </radialGradient>
    <linearGradient id="goldSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#D7B66F"/>
      <stop offset="100%" stop-color="#8C662D"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#toranBg)"/>

  <!-- Ornate Carved Doorframe Silhouette -->
  <rect x="60" y="40" width="480" height="370" fill="none" stroke="url(#goldSilk)" stroke-width="4" rx="6"/>
  <rect x="75" y="55" width="450" height="355" fill="none" stroke="url(#goldSilk)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Main Horizontal Floral Toran Beam -->
  <rect x="50" y="70" width="500" height="20" fill="url(#goldSilk)" rx="4"/>
  <rect x="50" y="75" width="500" height="10" fill="#641D2B"/>

  <!-- Mango Leaves (Aamche Paan) Hanging Down -->
  <g fill="#218C53" stroke="#0E4C2B" stroke-width="1.5">
    <!-- Leaf 1 -->
    <path d="M 90,90 Q 75,150 90,190 Q 105,150 90,90 Z"/>
    <!-- Leaf 2 -->
    <path d="M 150,90 Q 135,150 150,190 Q 165,150 150,90 Z"/>
    <!-- Leaf 3 -->
    <path d="M 210,90 Q 195,150 210,190 Q 225,150 210,90 Z"/>
    <!-- Leaf 4 -->
    <path d="M 270,90 Q 255,150 270,190 Q 285,150 270,90 Z"/>
    <!-- Leaf 5 -->
    <path d="M 330,90 Q 315,150 330,190 Q 345,150 330,90 Z"/>
    <!-- Leaf 6 -->
    <path d="M 390,90 Q 375,150 390,190 Q 405,150 390,90 Z"/>
    <!-- Leaf 7 -->
    <path d="M 450,90 Q 435,150 450,190 Q 465,150 450,90 Z"/>
    <!-- Leaf 8 -->
    <path d="M 510,90 Q 495,150 510,190 Q 525,150 510,90 Z"/>
  </g>

  <!-- Big Yellow & Orange Genda (Marigold) Flowers -->
  <g>
    <!-- Cluster 1 -->
    <circle cx="90" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="90" cy="90" r="12" fill="#FED330"/>
    <!-- Cluster 2 -->
    <circle cx="150" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="150" cy="90" r="12" fill="#FED330"/>
    <!-- Cluster 3 -->
    <circle cx="210" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="210" cy="90" r="12" fill="#FED330"/>
    <!-- Cluster 4 -->
    <circle cx="270" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="270" cy="90" r="12" fill="#FED330"/>
    <!-- Cluster 5 -->
    <circle cx="330" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="330" cy="90" r="12" fill="#FED330"/>
    <!-- Cluster 6 -->
    <circle cx="390" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="390" cy="90" r="12" fill="#FED330"/>
    <!-- Cluster 7 -->
    <circle cx="450" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="450" cy="90" r="12" fill="#FED330"/>
    <!-- Cluster 8 -->
    <circle cx="510" cy="90" r="18" fill="#FF9F1A"/>
    <circle cx="510" cy="90" r="12" fill="#FED330"/>
  </g>

  <!-- Hanging Pearl & Tassel Drops from Bottom of Leaves -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,3">
    <line x1="90" y1="190" x2="90" y2="240"/>
    <line x1="150" y1="190" x2="150" y2="240"/>
    <line x1="210" y1="190" x2="210" y2="240"/>
    <line x1="270" y1="190" x2="270" y2="240"/>
    <line x1="330" y1="190" x2="330" y2="240"/>
    <line x1="390" y1="190" x2="390" y2="240"/>
    <line x1="450" y1="190" x2="450" y2="240"/>
    <line x1="510" y1="190" x2="510" y2="240"/>
  </g>
  <!-- Gold Bells on Pearl Drops -->
  <circle cx="90" cy="245" r="5" fill="url(#goldSilk)"/>
  <circle cx="150" cy="245" r="5" fill="url(#goldSilk)"/>
  <circle cx="210" cy="245" r="5" fill="url(#goldSilk)"/>
  <circle cx="270" cy="245" r="5" fill="url(#goldSilk)"/>
  <circle cx="330" cy="245" r="5" fill="url(#goldSilk)"/>
  <circle cx="390" cy="245" r="5" fill="url(#goldSilk)"/>
  <circle cx="450" cy="245" r="5" fill="url(#goldSilk)"/>
  <circle cx="510" cy="245" r="5" fill="url(#goldSilk)"/>

  <!-- Center Shubh Kalash Icon -->
  <circle cx="300" cy="330" r="30" fill="url(#goldSilk)"/>
  <circle cx="300" cy="330" r="24" fill="#3D0B16"/>
  <text x="300" y="337" font-family="'Tiro Devanagari Marathi', sans-serif" font-size="18" fill="url(#goldSilk)" text-anchor="middle">शुभ</text>
</svg>
