<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="maroonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A101D"/>
      <stop offset="70%" stop-color="#310912"/>
      <stop offset="100%" stop-color="#1F040A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4"/>
      <stop offset="40%" stop-color="#D7B66F"/>
      <stop offset="70%" stop-color="#B58E4C"/>
      <stop offset="100%" stop-color="#846226"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Ornate Floral Dots -->
  <circle cx="64" cy="14" r="3" fill="url(#goldGrad)"/>
  <circle cx="64" cy="114" r="3" fill="url(#goldGrad)"/>
  <circle cx="14" cy="64" r="3" fill="url(#goldGrad)"/>
  <circle cx="114" cy="64" r="3" fill="url(#goldGrad)"/>

  <!-- Monogram N & C -->
  <text x="64" y="74" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1" filter="url(#goldGlow)">
    N&amp;C
  </text>
  
  <!-- Small Star/Lotus Symbol below -->
  <polygon points="64,82 66,86 70,86 67,89 68,93 64,90 60,93 61,89 58,86 62,86" fill="url(#goldGrad)"/>
</svg>
