<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="stageRoomBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4A101D"/>
      <stop offset="60%" stop-color="#2D060F"/>
      <stop offset="100%" stop-color="#140206"/>
    </radialGradient>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="50%" stop-color="#D7B66F"/>
      <stop offset="100%" stop-color="#8C662D"/>
    </linearGradient>
    <filter id="fairyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#stageRoomBg)"/>

  <!-- Back Wall Fairy Light Curtain -->
  <g opacity="0.8" filter="url(#fairyGlow)">
    <!-- Vertical Fairy Light Strings -->
    <line x1="100" y1="20" x2="100" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,16"/>
    <line x1="160" y1="20" x2="160" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,14"/>
    <line x1="220" y1="20" x2="220" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,18"/>
    <line x1="280" y1="20" x2="280" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,12"/>
    <line x1="340" y1="20" x2="340" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,15"/>
    <line x1="400" y1="20" x2="400" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,13"/>
    <line x1="460" y1="20" x2="460" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,17"/>
    <line x1="520" y1="20" x2="520" y2="350" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="2,14"/>
  </g>

  <!-- Giant Royal Floral Arch Backdrop -->
  <path d="M 120,380 C 120,120 480,120 480,380" fill="none" stroke="url(#warmGold)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 120,380 C 120,120 480,120 480,380" fill="none" stroke="#FF9F1A" stroke-width="10" stroke-linecap="round" stroke-dasharray="14,6"/>
  <path d="M 135,380 C 135,135 465,135 465,380" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8,6"/>

  <!-- Stage Platform Base -->
  <ellipse cx="300" cy="380" rx="260" ry="50" fill="#24050B" stroke="url(#warmGold)" stroke-width="3"/>
  <ellipse cx="300" cy="375" rx="240" ry="42" fill="#3D0B16"/>

  <!-- Royal Engagement Throne / Settee (Two-Seater with Carved Gold Arms) -->
  <g transform="translate(300, 310)">
    <!-- High Tufted Velvet Backrest -->
    <path d="M -120,10 C -120,-60 -50,-80 0,-80 C 50,-80 120,-60 120,10 Z" fill="#641D2B" stroke="url(#warmGold)" stroke-width="4"/>
    <circle cx="0" cy="-45" r="5" fill="url(#warmGold)"/>
    <circle cx="-50" cy="-35" r="4" fill="url(#warmGold)"/>
    <circle cx="50" cy="-35" r="4" fill="url(#warmGold)"/>
    
    <!-- Thick Velvet Seat Cushion -->
    <ellipse cx="0" cy="18" rx="125" ry="26" fill="#4A101D" stroke="url(#warmGold)" stroke-width="3"/>
    
    <!-- Left & Right Royal Bolster Pillows (Golu Ushi) in Gold Brocade -->
    <ellipse cx="-100" cy="8" rx="22" ry="14" fill="url(#warmGold)"/>
    <ellipse cx="100" cy="8" rx="22" ry="14" fill="url(#warmGold)"/>
  </g>
</svg>
